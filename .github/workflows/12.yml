name: OKI SM8750P 6.6.89 Feature Build

on:
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: '启用 SUSFS 2.3.0'
        type: boolean
        default: true
      enable_kpm:
        description: '启用 KPM'
        type: boolean
        default: true
      enable_droidspaces:
        description: '启用 Droidspaces (NTSync + Ipset)'
        type: boolean
        default: true
      enable_bbr:
        description: '启用 BBR'
        type: boolean
        default: true
      enable_adios:
        description: '启用 ADIOS IO 调度器'
        type: boolean
        default: true
      enable_cve_43499:
        description: '应用 CVE-2026-43499 rtmutex 修复'
        type: boolean
        default: true
      enable_nomount:
        description: '内置 NoMount'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5          # Node 24 runtime
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip patch make bc bison flex \
            libssl-dev libelf-dev clang-18 lld-18 llvm-18

      - name: Prepare feature fragment
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fragments"
          FRAG="$GITHUB_WORKSPACE/fragments/oki_features.fragment"
          {
            [ "${{ inputs.enable_kpm }}" = "true" ] && echo "CONFIG_KPM=y"
            [ "${{ inputs.enable_kpm }}" = "true" ] && echo "CONFIG_KALLSYMS_ALL=y"

            if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
              cat <<'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NTSYNC=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_MAX=256
          EOF
            fi

            if [ "${{ inputs.enable_bbr }}" = "true" ]; then
              cat <<'EOF'
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          EOF
            fi

            [ "${{ inputs.enable_adios }}" = "true" ] && echo "CONFIG_IOSCHED_ADIOS=y"
            [ "${{ inputs.enable_nomount }}" = "true" ] && echo "CONFIG_NOMOUNT=y"
          } > "$FRAG"
          echo "FRAGMENT_PATH=$FRAG" >> "$GITHUB_ENV"

      - name: Inject patches
        run: |
          set -e
          PATCHES="$GITHUB_WORKSPACE/patches"
          mkdir -p "$PATCHES"

          KERNEL_SRC=""
          for d in kernel common msm-kernel; do
            [ -f "$d/Makefile" ] && KERNEL_SRC="$d" && break
          done
          [ -z "$KERNEL_SRC" ] && echo "内核源码目录未找到" && exit 1
          echo "KERNEL_SRC=$KERNEL_SRC" >> "$GITHUB_ENV"

          safe_apply() {
            local p="$1"
            if patch -p1 --dry-run -d "$KERNEL_SRC" < "$p" >/dev/null 2>&1; then
              patch -p1 -d "$KERNEL_SRC" < "$p"
            else
              echo "跳过: $(basename "$p")"
            fi
          }

          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            curl -L -o "$PATCHES/susfs.zip" \
              "https://github.com/zzh20188/GKI_KernelSU_SUSFS/releases/download/v2.3.0-r5/SUSFS-Patches-6.6.zip"
            unzip -o "$PATCHES/susfs.zip" -d "$PATCHES/susfs" >/dev/null 2>&1 || true
            find "$PATCHES/susfs" -name "*.patch" | sort | while read -r p; do safe_apply "$p"; done
          fi

          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            for url in \
              "https://github.com/Goldzxcbug/Droidspaces_Kernel_patch/raw/main/6.6/ntsync_base.patch" \
              "https://github.com/Goldzxcbug/Droidspaces_Kernel_patch/raw/main/6.6/android15-6.6.patch" \
              "https://github.com/Goldzxcbug/Droidspaces_Kernel_patch/raw/main/6.6/04.sysvipc_task
